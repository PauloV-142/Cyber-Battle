<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Battle</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;800;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/x-icon" href="assets/cyber_battle.ico">
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.55.0/dist/phaser.js"></script>
</head>
<body>
    <div id="startup-splash" class="startup-splash" role="status" aria-label="Carregando o jogo" hidden>
        <img class="startup-splash__image" src="assets/cyber_battle.png" alt="">
    </div>

    <main id="home-screen" class="home-screen">
        <img class="home-light home-light--top" src="assets/home/HomeLightSide.png" alt="">
        <img class="home-light home-light--bottom" src="assets/home/HomeLightSide.png" alt="">

        <img class="home-controller home-controller--top" src="assets/home/HomeControllerSIde.png" alt="">
        <img class="home-controller home-controller--bottom" src="assets/home/HomeControllerSIde.png" alt="">

        <section class="home-content" aria-label="Menu principal">
            <h1 class="game-title">Cyber<br>Battle</h1>
            <a class="play-button" href="#builder-screen" data-click-sound="assets/sounds/click/yarzur_ofc-sfx42-click-sel-534293.mp3">Jogar</a>
        </section>
    </main>

    <div id="builder-screen" hidden style="display: none;"></div>
    <section id="tutorial-screen" class="tutorial-screen" hidden aria-label="Tutorial do jogo">
        <div class="tutorial-card tutorial-card--player-one">
            <h2>Jogador 1</h2>
            <p>Para se movimentar, use:</p>
            <div class="key-grid key-grid--wasd"><span>W</span><span>A</span><span>S</span><span>D</span></div>
            <small>TECLAS WASD</small>
            <p>Para disparar, use:</p>
            <div class="key-wide">ESPAÇO</div>
            <small>BARRA DE ESPAÇO</small>
        </div>
        <div class="tutorial-center">
            <div class="tutorial-logo">CYBER<br>BATTLE</div>
            <button id="tutorial-start" class="tutorial-start" type="button">OK</button>
        </div>
        <div class="tutorial-card tutorial-card--player-two">
            <h2>Jogador 2</h2>
            <p>Para se movimentar, use:</p>
            <div class="key-grid key-grid--arrows"><span>↑</span><span>←</span><span>↓</span><span>→</span></div>
            <small>SETAS DO TECLADO</small>
            <p>Para disparar, use:</p>
            <div class="key-single">L</div>
            <small>TECLA “L”</small>
        </div>
    </section>
    <div id="game-screen" hidden>
        <section class="scoreboard" aria-label="Placar da batalha">
            <div class="scoreboard__player scoreboard__player--one">
                <div class="scoreboard__identity"><strong>JOGADOR 1</strong></div>
                <div class="scoreboard__health" aria-label="Vida do jogador 1"><span id="player-one-health"></span></div>
                <strong class="scoreboard__score scoreboard__score--tie" id="player-one-score">0</strong>
            </div>
            <div class="scoreboard__controls" aria-label="Controles do jogo">
                <button class="scoreboard__pause" id="pause-game" type="button" aria-label="Pausar jogo" aria-pressed="false"><span aria-hidden="true">Ⅱ</span></button>
                <a class="scoreboard__home" href="index.html" aria-label="Voltar para a página inicial"><span aria-hidden="true">⌂</span></a>
            </div>
            <div class="scoreboard__player scoreboard__player--two">
                <strong class="scoreboard__score scoreboard__score--tie" id="player-two-score">0</strong>
                <div class="scoreboard__health" aria-label="Vida do jogador 2"><span id="player-two-health"></span></div>
                <div class="scoreboard__identity"><strong>JOGADOR 2</strong></div>
            </div>
        </section>
        <div id="game-canvas" aria-label="Mapa da batalha"></div>
        <section id="match-result" class="match-result" hidden aria-label="Resultado da partida"></section>
    </div>

    <script src="builder.js"></script>
    <script src="main.js"></script>
    <audio id="click-sound" preload="auto" src="assets/sounds/click/yarzur_ofc-sfx42-click-sel-534293.mp3"></audio>
    <audio id="home-music" preload="auto"></audio>
    <audio id="game-music" preload="auto"></audio>
    <script>
        const playButton = document.querySelector('.play-button');
        const homeScreen = document.getElementById('home-screen');
        const builderScreen = document.getElementById('builder-screen');
        const clickSound = document.getElementById('click-sound');
        const homeMusic = document.getElementById('home-music');
        const gameMusic = document.getElementById('game-music');
        const homeMusicTracks = [
            'assets/music/home/maksymmalko-game-minecraft-gaming-background-music-402451.mp3',
            'assets/music/home/serhii_kliets-spaceship-arcade-shooter-game-background-soundtrack-318508.mp3'
        ];
        let homeMusicIndex = 0;
        let gameMusicIndex = 0;

        function playHomeMusicTrack() {
            homeMusic.src = homeMusicTracks[homeMusicIndex];
            homeMusic.currentTime = 0;
            homeMusic.volume = 0.21;
            return homeMusic.play().catch(() => false);
        }

        function startHomeMusic() {
            if (!homeMusic.paused) return;

            playHomeMusicTrack().then((started) => {
                if (started === false) {
                    document.addEventListener('pointerdown', startHomeMusic, { once: true });
                    document.addEventListener('keydown', startHomeMusic, { once: true });
                }
            });
        }

        homeMusic.addEventListener('ended', () => {
            homeMusicIndex = (homeMusicIndex + 1) % homeMusicTracks.length;
            playHomeMusicTrack();
        });

        window.stopHomeMusic = () => {
            homeMusic.pause();
            homeMusic.currentTime = 0;
        };

        function playGameMusicTrack() {
            const gameMusicTracks = [
                'assets/music/game/maksymmalko-game-gaming-minecraft-background-music-362844.mp3',
                'assets/music/game/mondamusic-retro-arcade-game-music-512837.mp3',
                'assets/music/game/nunusev-video-game-battle-music-535133.mp3'
            ];
            gameMusic.src = gameMusicTracks[gameMusicIndex];
            gameMusic.currentTime = 0;
            gameMusic.volume = 0.11;
            gameMusic.play().catch(() => {});
        }

        gameMusic.addEventListener('ended', () => {
            gameMusicIndex = (gameMusicIndex + 1) % 3;
            playGameMusicTrack();
        });

        window.startGameMusic = () => {
            if (gameMusic.paused) playGameMusicTrack();
        };

        window.stopGameMusic = () => {
            gameMusic.pause();
            gameMusic.currentTime = 0;
        };

        window.pauseGameMusic = () => gameMusic.pause();
        window.resumeGameMusic = () => gameMusic.play().catch(() => {});

        clickSound.volume = 0.75;
        clickSound.load();

        function playClickSound() {
            const sound = clickSound.cloneNode();
            sound.volume = clickSound.volume;
            sound.currentTime = 0;
            sound.play().catch(() => {});
        }

        startHomeMusic();

        playButton.addEventListener('click', (event) => {
            event.preventDefault();
            homeScreen.style.display = 'none';
            builderScreen.hidden = false;
            builderScreen.style.display = 'flex';
            playClickSound();
            startHomeMusic();
        });

        document.addEventListener('click', (event) => {
            if (!event.target.closest('button')) return;

            playClickSound();
        }, true);
    </script>
</body>
</html>
