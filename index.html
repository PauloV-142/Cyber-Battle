<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Tank</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;800;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.55.0/dist/phaser.js"></script>
</head>
<body>
    <main id="home-screen" class="home-screen">
        <img class="home-light home-light--top" src="assets/home/HomeLightSide.png" alt="">
        <img class="home-light home-light--bottom" src="assets/home/HomeLightSide.png" alt="">

        <img class="home-controller home-controller--top" src="assets/home/HomeControllerSIde.png" alt="">
        <img class="home-controller home-controller--bottom" src="assets/home/HomeControllerSIde.png" alt="">

        <section class="home-content" aria-label="Menu principal">
            <h1 class="game-title">Cyber<br>Tank</h1>
            <a class="play-button" href="#builder-screen" data-click-sound="assets/sounds/click/yarzur_ofc-sfx42-click-sel-534293.mp3">Jogar</a>
        </section>
    </main>

    <div id="builder-screen" hidden style="display: none;"></div>
    <div id="game-screen" hidden></div>

    <script src="builder.js"></script>
    <script src="main.js"></script>
    <audio id="click-sound" preload="auto" src="assets/sounds/click/yarzur_ofc-sfx42-click-sel-534293.mp3"></audio>
    <audio id="home-music" preload="auto"></audio>
    <script>
        const playButton = document.querySelector('.play-button');
        const homeScreen = document.getElementById('home-screen');
        const builderScreen = document.getElementById('builder-screen');
        const clickSound = document.getElementById('click-sound');
        const homeMusic = document.getElementById('home-music');
        const homeMusicTracks = [
            'assets/music/home/maksymmalko-game-minecraft-gaming-background-music-402451.mp3',
            'assets/music/home/serhii_kliets-spaceship-arcade-shooter-game-background-soundtrack-318508.mp3'
        ];
        let homeMusicIndex = 0;

        function playHomeMusicTrack() {
            homeMusic.src = homeMusicTracks[homeMusicIndex];
            homeMusic.currentTime = 0;
            return homeMusic.play().catch(() => false);
        }

        function startHomeMusic() {
            if (!homeMusic.paused) return;

            playHomeMusicTrack().then((started) => {
                if (started === false) {
                    document.addEventListener('pointerdown', startHomeMusic, { once: true });
                    document.addEventListener('keydown', startHomeMusic, { once: true });
                }
            });
        }

        homeMusic.addEventListener('ended', () => {
            homeMusicIndex = (homeMusicIndex + 1) % homeMusicTracks.length;
            playHomeMusicTrack();
        });

        window.stopHomeMusic = () => {
            homeMusic.pause();
            homeMusic.currentTime = 0;
        };

        clickSound.volume = 0.25;
        clickSound.load();
        startHomeMusic();

        playButton.addEventListener('click', (event) => {
            event.preventDefault();
            clickSound.currentTime = 0;
            homeScreen.style.display = 'none';
            builderScreen.hidden = false;
            builderScreen.style.display = 'flex';
            clickSound.play().catch(() => {});
            startHomeMusic();
        });

        document.addEventListener('click', (event) => {
            if (!event.target.closest('#builder-screen button')) return;

            clickSound.currentTime = 0;
            clickSound.play().catch(() => {});
        }, true);
    </script>
</body>
</html>
